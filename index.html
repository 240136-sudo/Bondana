<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud DM App</title>
    <style>
        /* ... (ваши стили) ... */
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        /* Стили для DM */
        .users-list { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid #eee; margin-bottom: 15px; }
        .user-card { text-align: center; cursor: pointer; min-width: 70px; }
        .user-card img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid transparent; }
        .user-card.active img { border-color: #007bff; }
        .user-card span { font-size: 11px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .chat-box { height: 300px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 15px; font-size: 14px; position: relative; }
        .msg.sent { align-self: flex-end; background: #007bff; color: white; }
        .msg.received { align-self: flex-start; background: #e4e6eb; color: black; }
        
        .dm-input-area { display: flex; gap: 8px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="authSection" class="container">
        <button id="loginBtn">Войти через Google</button>
        <div id="userInfo" class="hidden" style="display: flex; align-items: center; gap: 10px;">
            <img id="userPhoto" style="width:35px; border-radius:50%">
            <span id="userName" style="font-weight:bold"></span>
            <button id="logoutBtn" style="width:auto; padding: 5px 10px;">Выйти</button>
        </div>
    </div>

    <div id="dmSection" class="container hidden">
        <h4 style="margin:0 0 10px 0;">Выберите собеседника:</h4>
        <div id="usersList" class="users-list"></div>
        
        <div id="chatInterface" class="hidden">
            <h5 id="chatWithTitle">Чат с: ...</h5>
            <div id="chatBox" class="chat-box"></div>
            <div class="dm-input-area">
                <input type="text" id="dmInput" placeholder="Ваше сообщение...">
                <button id="sendDmBtn" style="width: auto;">✈️</button>
            </div>
        </div>
    </div>

    <div id="messageForm" class="container hidden">
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, query, orderBy, onSnapshot, 
            serverTimestamp, doc, setDoc, where, or, and
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { 
            getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7bs-_BvEJKV0U3f9_klBTkI25igRLjTI",
            authDomain: "sosulka-25c8c.firebaseapp.com",
            projectId: "sosulka-25c8c",
            storageBucket: "sosulka-25c8c.firebasestorage.app",
            messagingSenderId: "174052400821",
            appId: "1:174052400821:web:c6fc715b5c7de2beeae8fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let selectedUserId = null;
        let dmUnsubscribe = null;

        // Авторизация
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Сохраняем пользователя в список доступных для чата
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    name: user.displayName,
                    photo: user.photoURL,
                    lastSeen: serverTimestamp()
                }, { merge: true });

                document.getElementById('authSection').querySelector('#loginBtn').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('dmSection').classList.remove('hidden');
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('userPhoto').src = user.photoURL;
                
                loadUsers();
            } else {
                location.reload(); // Для простоты при выходе
            }
        });

        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        // Загрузка списка пользователей
        function loadUsers() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const list = document.getElementById('usersList');
                list.innerHTML = "";
                snapshot.forEach(doc => {
                    const userData = doc.data();
                    if (userData.uid === auth.currentUser.uid) return; // Не показывать себя

                    const div = document.createElement('div');
                    div.className = `user-card ${selectedUserId === userData.uid ? 'active' : ''}`;
                    div.innerHTML = `<img src="${userData.photo}"><span>${userData.name.split(' ')[0]}</span>`;
                    div.onclick = () => startChat(userData);
                    list.appendChild(div);
                });
            });
        }

        // Открытие чата
        function startChat(targetUser) {
            selectedUserId = targetUser.uid;
            document.getElementById('chatInterface').classList.remove('hidden');
            document.getElementById('chatWithTitle').innerText = "Чат с: " + targetUser.name;
            loadMessages();
        }

        // Загрузка сообщений (DM)
        function loadMessages() {
            if (dmUnsubscribe) dmUnsubscribe();

            // Сложный запрос: сообщения где я отправитель И он получатель ИЛИ наоборот
            const q = query(
                collection(db, "direct_messages"),
                where("chatKey", "in", [
                    `${auth.currentUser.uid}_${selectedUserId}`,
                    `${selectedUserId}_${auth.currentUser.uid}`
                ]),
                orderBy("timestamp", "asc")
            );

            dmUnsubscribe = onSnapshot(q, (snapshot) => {
                const box = document.getElementById('chatBox');
                box.innerHTML = "";
                snapshot.forEach(doc => {
                    const m = doc.data();
                    const side = m.senderId === auth.currentUser.uid ? 'sent' : 'received';
                    box.innerHTML += `<div class="msg ${side}">${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // Отправка ЛС
        document.getElementById('sendDmBtn').onclick = async () => {
            const text = document.getElementById('dmInput').value;
            if (!text || !selectedUserId) return;

            await addDoc(collection(db, "direct_messages"), {
                text: text,
                senderId: auth.currentUser.uid,
                receiverId: selectedUserId,
                chatKey: `${auth.currentUser.uid}_${selectedUserId}`, // Ключ для поиска
                timestamp: serverTimestamp()
            });

            document.getElementById('dmInput').value = "";
        };
    </script>
</body>
</html>
