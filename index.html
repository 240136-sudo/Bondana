<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud App + DM</title>

<style>
body { font-family: Arial; background:#f0f2f5; display:flex; flex-direction:column; align-items:center; }
.container { width:500px; background:#fff; padding:20px; border-radius:10px; margin:10px; }

#chatBox { height:200px; overflow-y:auto; border:1px solid #ccc; padding:10px; margin:10px 0; }

.msg { margin:5px 0; }
.me { text-align:right; color:blue; }
.other { text-align:left; color:black; }

button { padding:10px; margin-top:5px; }
</style>
</head>

<body>

<div class="container">
    <button id="loginBtn">Войти через Google</button>

    <div id="userInfo" style="display:none;">
        <span id="userName"></span>
        <button id="logoutBtn">Выйти</button>
    </div>
</div>

<!-- DM -->
<div id="dmSection" class="container" style="display:none;">
    <h3>Личные сообщения</h3>

    <select id="userSelect"></select>

    <div id="chatBox"></div>

    <input type="text" id="dmInput" placeholder="Сообщение">
    <button id="sendDmBtn">Отправить</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
    getFirestore, collection, addDoc, onSnapshot,
    serverTimestamp, query, orderBy, doc, setDoc, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

import {
    getAuth, signInWithPopup, GoogleAuthProvider,
    signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyB7bs-_BvEJKV0U3f9_klBTkI25igRLjTI",
    authDomain: "sosulka-25c8c.firebaseapp.com",
    projectId: "sosulka-25c8c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let unsubscribeDM = null;

loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
    if (user) {
        userInfo.style.display = "block";
        loginBtn.style.display = "none";
        dmSection.style.display = "block";

        userName.innerText = user.displayName;

        // сохранить пользователя
        await setDoc(doc(db, "users", user.uid), {
            name: user.displayName,
            email: user.email
        });

        loadUsers();

    } else {
        userInfo.style.display = "none";
        loginBtn.style.display = "block";
        dmSection.style.display = "none";
    }
});

// загрузка пользователей
async function loadUsers() {
    const snap = await getDocs(collection(db, "users"));
    userSelect.innerHTML = "";

    snap.forEach(d => {
        if (d.id === auth.currentUser.uid) return;
        const u = d.data();
        userSelect.innerHTML += `<option value="${d.id}">${u.name}</option>`;
    });

    startListeningDM();
}

// отправка
sendDmBtn.onclick = async () => {
    const text = dmInput.value;
    const receiverId = userSelect.value;

    if (!text) return;

    await addDoc(collection(db, "direct_messages"), {
        senderId: auth.currentUser.uid,
        receiverId,
        text,
        timestamp: serverTimestamp()
    });

    dmInput.value = "";
};

// слушаем чат
function startListeningDM() {

    if (unsubscribeDM) unsubscribeDM();

    const q = query(
        collection(db, "direct_messages"),
        orderBy("timestamp")
    );

    unsubscribeDM = onSnapshot(q, (snapshot) => {
        chatBox.innerHTML = "";

        snapshot.forEach(docSnap => {
            const m = docSnap.data();

            const myId = auth.currentUser.uid;
            const selected = userSelect.value;

            if (
                (m.senderId === myId && m.receiverId === selected) ||
                (m.senderId === selected && m.receiverId === myId)
            ) {
                chatBox.innerHTML += `
                    <div class="msg ${m.senderId === myId ? 'me' : 'other'}">
                        ${m.text}
                    </div>
                `;
            }
        });

        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

// при смене пользователя
userSelect.onchange = () => startListeningDM();

</script>

</body>
</html>
