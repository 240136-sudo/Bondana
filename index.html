<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Cloud App</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        /* Чат */
        .users-list { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .user-card { text-align: center; cursor: pointer; min-width: 60px; }
        .user-card img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #007bff; }
        .chat-msgs { height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #fafafa; padding: 10px; border-radius: 8px; margin: 10px 0; }
        .msg { padding: 8px 12px; border-radius: 12px; font-size: 13px; max-width: 80%; }
        .msg.sent { align-self: flex-end; background: #007bff; color: white; }
        .msg.received { align-self: flex-start; background: #e4e6eb; }

        /* Посты */
        .post { background: white; border-radius: 12px; padding: 16px; margin-top: 15px; width: 100%; max-width: 500px; position: relative; }
        .post img { width: 100%; border-radius: 8px; margin-top: 10px; }
        .post-header { display: flex; justify-content: space-between; align-items: center; }
        .btn-del { color: #ff4d4d; cursor: pointer; font-size: 12px; }
        .like-btn { cursor: pointer; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 5px 10px; border-radius: 20px; display: inline-block; margin-top: 10px; }
        
        .hidden { display: none !important; }
        input[type="text"], button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="authSection" class="container">
        <button id="loginBtn">Войти через Google</button>
        <div id="userInfo" class="hidden" style="display:flex; align-items:center; gap:10px;">
            <img id="userPhoto" style="width:35px; border-radius:50%">
            <b id="userName"></b>
            <button id="logoutBtn" style="width:auto; background:#eee; color:#333;">Выйти</button>
        </div>
    </div>

    <div id="dmSection" class="container hidden">
        <h4>Личные сообщения</h4>
        <div id="usersList" class="users-list"></div>
        <div id="activeChat" class="hidden">
            <b id="chatTitle"></b>
            <div id="chatMsgs" class="chat-msgs"></div>
            <div style="display:flex; gap:5px">
                <input type="text" id="dmInput" placeholder="Сообщение...">
                <button id="sendDmBtn" style="width:50px">✈️</button>
            </div>
        </div>
    </div>

    <div id="postForm" class="container hidden">
        <input type="text" id="content" placeholder="Что нового?">
        <input type="file" id="imageInput" accept="image/*">
        <button id="mainBtn">Опубликовать</button>
    </div>

    <div id="feed"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, doc, increment, deleteDoc, setDoc, where } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7bs-_BvEJKV0U3f9_klBTkI25igRLjTI",
            authDomain: "sosulka-25c8c.firebaseapp.com",
            projectId: "sosulka-25c8c",
            storageBucket: "sosulka-25c8c.firebasestorage.app",
            messagingSenderId: "174052400821",
            appId: "1:174052400821:web:c6fc715b5c7de2beeae8fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let selectedUserId = null;
        let dmUnsub = null;

        const getChatKey = (id1, id2) => [id1, id2].sort().join('_');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('authSection').querySelector('button').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.querySelectorAll('.hidden').forEach(el => el.classList.remove('hidden'));
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('userPhoto').src = user.photoURL;

                await setDoc(doc(db, "users", user.uid), { uid: user.uid, name: user.displayName, photo: user.photoURL }, { merge: true });
                loadUsers();
                loadFeed();
            } else {
                location.reload();
            }
        });

        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        // --- ЛОГИКА ЛЕНТЫ ---
        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('image', file);
            const res = await fetch('https://api.imgur.com/3/image', {
                method: 'POST',
                headers: { Authorization: 'Client-ID YOUR_IMGUR_CLIENT_ID' }, // Вставь свой ID если есть
                body: formData
            });
            const data = await res.json();
            return data.data.link;
        }

        document.getElementById('mainBtn').onclick = async () => {
            const text = document.getElementById('content').value;
            const file = document.getElementById('imageInput').files[0];
            let imgUrl = null;
            if (file) imgUrl = await uploadImage(file);

            await addDoc(collection(db, "requests"), {
                name: auth.currentUser.displayName,
                text: text,
                image: imgUrl,
                likes: 0,
                email: auth.currentUser.email,
                timestamp: serverTimestamp()
            });
            document.getElementById('content').value = "";
        };

        function loadFeed() {
            onSnapshot(query(collection(db, "requests"), orderBy("timestamp", "desc")), (snap) => {
                const feed = document.getElementById('feed');
                feed.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    const isMy = p.email === auth.currentUser.email;
                    feed.innerHTML += `
                        <div class="post">
                            <div class="post-header">
                                <b>${p.name}</b>
                                ${isMy ? `<span class="btn-del" onclick="deletePost('${d.id}')">Удалить</span>` : ''}
                            </div>
                            <p>${p.text}</p>
                            ${p.image ? `<img src="${p.image}">` : ''}
                            <div class="like-btn" onclick="likePost('${d.id}')">❤️ ${p.likes || 0}</div>
                        </div>`;
                });
            });
        }

        window.likePost = (id) => updateDoc(doc(db, "requests", id), { likes: increment(1) });
        window.deletePost = (id) => { if(confirm("Удалить?")) deleteDoc(doc(db, "requests", id)); };

        // --- ЛОГИКА ЧАТА ---
        function loadUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('usersList');
                list.innerHTML = "";
                snap.forEach(d => {
                    const u = d.data();
                    if (u.uid === auth.currentUser.uid) return;
                    list.innerHTML += `<div class="user-card" onclick="openChat('${u.uid}', '${u.name}')"><img src="${u.photo}"><span>${u.name.split(' ')[0]}</span></div>`;
                });
            });
        }

        window.openChat = (id, name) => {
            selectedUserId = id;
            document.getElementById('activeChat').classList.remove('hidden');
            document.getElementById('chatTitle').innerText = "Чат с: " + name;
            if (dmUnsub) dmUnsub();
            dmUnsub = onSnapshot(query(collection(db, "direct_messages"), where("chatKey", "==", getChatKey(auth.currentUser.uid, id)), orderBy("timestamp", "asc")), (snap) => {
                const box = document.getElementById('chatMsgs');
                box.innerHTML = "";
                snap.forEach(mDoc => {
                    const m = mDoc.data();
                    const cls = m.senderId === auth.currentUser.uid ? 'sent' : 'received';
                    box.innerHTML += `<div class="msg ${cls}">${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        };

        document.getElementById('sendDmBtn').onclick = async () => {
            const inp = document.getElementById('dmInput');
            if (!inp.value || !selectedUserId) return;
            await addDoc(collection(db, "direct_messages"), {
                text: inp.value,
                senderId: auth.currentUser.uid,
                receiverId: selectedUserId,
                chatKey: getChatKey(auth.currentUser.uid, selectedUserId),
                timestamp: serverTimestamp()
            });
            inp.value = "";
        };
    </script>
</body>
</html>
