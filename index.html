<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BaaS Control Panel</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        button { cursor: pointer; transition: 0.3s; font-weight: 600; border-radius: 6px; border: none; }
        #mainBtn { background: #007bff; color: white; padding: 12px; width: 100%; margin-top: 10px; }
        #mainBtn:hover { background: #0056b3; }
        #filterBtn { background: #6c757d; color: white; padding: 10px; width: 100%; margin-top: 10px; font-size: 13px; }
        
        .post { background: #fff; border: 1px solid #eaeaea; padding: 15px; margin-top: 15px; border-radius: 8px; width: 100%; max-width: 500px; position: relative; }
        .like-btn { background: #f8f9fa; padding: 5px 12px; border-radius: 20px; font-size: 14px; margin-right: 8px; }
        .like-btn:hover { background: #e2e6ea; }
        .del-btn { background: #fff0f0; color: #dc3545; padding: 5px 12px; border-radius: 20px; font-size: 14px; float: right; }
        .del-btn:hover { background: #ffc9c9; }
        .time { font-size: 11px; color: #999; float: right; margin-left: 10px; }
        .status-bar { font-size: 12px; color: #666; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h3>Панель управления BaaS</h3>
        <div class="status-bar" id="statusText">Режим: Все записи</div>
        <input type="text" id="name" placeholder="Имя профиля">
        <input type="email" id="email" placeholder="Рабочий Email">
        
        <button id="mainBtn">Опубликовать в облако</button>
        <button id="filterBtn" onclick="toggleFilter()">Показать популярные (5+ 👍)</button>
    </div>

    <div id="feed" style="width: 100%; max-width: 500px;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, query, orderBy, onSnapshot, 
            serverTimestamp, updateDoc, doc, increment, deleteDoc, where 
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // КОНФИГУРАЦИЯ
        const firebaseConfig = {
            apiKey: "AIzaSyB7bs-_BvEJKV0U3f9_klBTkI25igRLjTI",
            authDomain: "sosulka-25c8c.firebaseapp.com",
            projectId: "sosulka-25c8c",
            storageBucket: "sosulka-25c8c.firebasestorage.app",
            messagingSenderId: "174052400821",
            appId: "1:174052400821:web:c6fc715b5c7de2beeae8fc",
            measurementId: "G-8ZDNQ16FS2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isFilterActive = false;
        let unsubscribe = null;

        // 1. ФУНКЦИЯ: УДАЛЕНИЕ (НОВАЯ)
        window.deletePost = async (id) => {
            if (confirm("Удалить это сообщение навсегда?")) {
                try {
                    await deleteDoc(doc(db, "requests", id));
                } catch (e) {
                    alert("Ошибка доступа: У вас нет прав на удаление.");
                }
            }
        };

        // 2. ФУНКЦИЯ: ПЕРЕКЛЮЧЕНИЕ ФИЛЬТРАЦИИ (НОВАЯ)
        window.toggleFilter = () => {
            isFilterActive = !isFilterActive;
            const btn = document.getElementById('filterBtn');
            const status = document.getElementById('statusText');
            
            btn.innerText = isFilterActive ? "Показать все" : "Показать популярные (5+ 👍)";
            status.innerText = isFilterActive ? "Режим: Только популярные" : "Режим: Все записи";
            
            startListening(); // Перезапускаем поток данных с новыми условиями
        };

        // ЛАЙКИ
        window.processLike = async (id) => {
            const docRef = doc(db, "requests", id);
            try {
                await updateDoc(docRef, { likes: increment(1) });
            } catch (e) {
                console.error("Ошибка обновления:", e.message);
            }
        };

        // ЗАПИСЬ
        document.getElementById('mainBtn').onclick = async () => {
            const btn = document.getElementById('mainBtn');
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            if(!name || !email) return alert("Заполните поля!");

            btn.disabled = true;
            try {
                await addDoc(collection(db, "requests"), {
                    name: name,
                    email: email,
                    likes: 0,
                    timestamp: serverTimestamp()
                });
                document.getElementById('email').value = "";
            } catch (e) {
                alert("Ошибка безопасности: Проверьте правила Firestore.");
            }
            btn.disabled = false;
        };

        // REAL-TIME ПОТОК (Улучшен для фильтрации)
        function startListening() {
            if (unsubscribe) unsubscribe(); // Останавливаем старую подписку

            let q;
            if (isFilterActive) {
                // Если фильтр включен: только записи с 5+ лайками
                q = query(collection(db, "requests"), where("likes", ">=", 5), orderBy("likes", "desc"));
            } else {
                // Обычный режим: все записи по времени
                q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
            }

            unsubscribe = onSnapshot(q, (snapshot) => {
                const feed = document.getElementById('feed');
                feed.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const time = data.timestamp ? data.timestamp.toDate().toLocaleTimeString() : "...";
                    
                    feed.innerHTML += `
                        <div class="post">
                            <span class="time">${time}</span>
                            <b>${data.name}</b>
                            <p style="margin: 5px 0; color: #444;">${data.email}</p>
                            <button class="like-btn" onclick="processLike('${doc.id}')">👍 ${data.likes || 0}</button>
                            <button class="del-btn" onclick="deletePost('${doc.id}')">Удалить</button>
                        </div>
                    `;
                });
            });
        }

        // Запуск при старте
        startListening();
    </script>
</body>
</html>
